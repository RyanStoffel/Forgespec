swagger: "2.0"
info:
  title: forgespec-api
  version: "1.0"
host: forgespec-gateway-d8ibwq8j.uc.gateway.dev
schemes:
  - https
produces:
  - application/json

securityDefinitions:
  firebase:
    authorizationUrl: ""
    flow: implicit
    type: oauth2
    x-google-issuer: "https://securetoken.google.com/csc323-final"
    x-google-jwks_uri: "https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com"
    x-google-audiences: "csc323-final"
  api_key:
    type: apiKey
    name: x-api-key
    in: header

security:
  - firebase: []

paths:
  /parts:
    get:
      operationId: getParts
      summary: Search the parts catalog
      parameters:
        - in: query
          name: category
          type: string
        - in: query
          name: search
          type: string
      x-google-backend:
        address: https://parts-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    options:
      operationId: corsParts
      security: []
      x-google-backend:
        address: https://parts-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "204":
          description: CORS preflight

  /builds:
    post:
      operationId: createBuild
      summary: Save or finalize a build
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
    options:
      operationId: corsBuilds
      security: []
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "204":
          description: CORS preflight

  /builds/{buildId}:
    get:
      operationId: getBuild
      summary: Retrieve a saved build and its analysis result
      parameters:
        - in: path
          name: buildId
          required: true
          type: string
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    options:
      operationId: corsBuildById
      security: []
      parameters:
        - in: path
          name: buildId
          required: true
          type: string
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "204":
          description: CORS preflight

  /benchmarks:
    post:
      operationId: createBenchmark
      summary: Upload a benchmark screenshot
      x-google-backend:
        address: https://benchmark-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
    options:
      operationId: corsBenchmarks
      security: []
      x-google-backend:
        address: https://benchmark-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "204":
          description: CORS preflight

  /benchmarks/{benchmarkId}:
    get:
      operationId: getBenchmark
      summary: Retrieve benchmark comparison result
      parameters:
        - in: path
          name: benchmarkId
          required: true
          type: string
      x-google-backend:
        address: https://benchmark-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    options:
      operationId: corsBenchmarkById
      security: []
      parameters:
        - in: path
          name: benchmarkId
          required: true
          type: string
      x-google-backend:
        address: https://benchmark-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "204":
          description: CORS preflight

  /builds/{buildId}/analyze:
    post:
      operationId: analyzeBuild
      summary: Re-trigger analyses on an existing build
      parameters:
        - in: path
          name: buildId
          required: true
          type: string
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "202":
          description: Accepted
        "401":
          description: Unauthorized
    options:
      operationId: corsAnalyzeBuild
      security: []
      parameters:
        - in: path
          name: buildId
          required: true
          type: string
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "204":
          description: CORS preflight

  /builds/{buildId}/rename:
    post:
      operationId: renameBuild
      summary: Rename a build (POST tunnel for PATCH)
      parameters:
        - in: path
          name: buildId
          required: true
          type: string
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    options:
      operationId: corsRenameBuild
      security: []
      parameters:
        - in: path
          name: buildId
          required: true
          type: string
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "204":
          description: CORS preflight

  /builds/{buildId}/delete:
    post:
      operationId: deleteBuild
      summary: Delete a build (POST tunnel for DELETE)
      parameters:
        - in: path
          name: buildId
          required: true
          type: string
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    options:
      operationId: corsDeleteBuild
      security: []
      parameters:
        - in: path
          name: buildId
          required: true
          type: string
      x-google-backend:
        address: https://build-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "204":
          description: CORS preflight

  /benchmarks/{benchmarkId}/delete:
    post:
      operationId: deleteBenchmark
      summary: Delete a benchmark (POST tunnel for DELETE)
      parameters:
        - in: path
          name: benchmarkId
          required: true
          type: string
      x-google-backend:
        address: https://benchmark-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
    options:
      operationId: corsDeleteBenchmark
      security: []
      parameters:
        - in: path
          name: benchmarkId
          required: true
          type: string
      x-google-backend:
        address: https://benchmark-api-5qbytyegcq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "204":
          description: CORS preflight
